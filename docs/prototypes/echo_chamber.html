<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo Chamber</title>
<style>
:root{
  --ink:#eceff7; --mute:#8b93ab; --line:#262b3d; --panel:#12151f; --panel2:#181c29;
  --amber:#ffb547; --pink:#ff3b6b; --green:#3ddc97; --blue:#5b8cff; --paper:#f1ece0;
  --font: ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#090706;color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none}
#vp{position:fixed;inset:0}
#fit{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000}
#world{position:absolute;inset:0;transform-origin:0 0;transition:transform 1s cubic-bezier(.6,.05,.25,1)}
.zoom #world{transform:translate(-960px,-400px) scale(2)}

/* ---------- room ---------- */
#room{position:absolute;inset:0;background:linear-gradient(180deg,#3b2c26 0,#2a1f1b 62%,#1d1512 100%)}
#room .stripes{position:absolute;inset:0 0 380px 0;background:repeating-linear-gradient(90deg,#0000 0 118px,#0000000d 118px 120px)}
#room .skirt{position:absolute;left:0;right:0;top:668px;height:26px;background:#1a110e;box-shadow:0 -2px 0 #4a382f}
#desk{position:absolute;left:0;right:0;top:694px;bottom:0;background:linear-gradient(180deg,#6b4a33 0,#553a28 14%,#3e2b1e 100%);box-shadow:inset 0 3px 0 #8a6444}
#desk:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 160px,#00000014 160px 161px),repeating-linear-gradient(0deg,#0000 0 40px,#ffffff06 40px 41px)}
.lamp-glow{position:absolute;left:-120px;top:320px;width:700px;height:700px;background:radial-gradient(closest-side,#ffb54738,#0000);pointer-events:none}
.lcd-glow{position:absolute;left:300px;top:60px;width:1320px;height:900px;background:radial-gradient(closest-side,#6a8cff22,#0000);pointer-events:none;transition:opacity .6s}
.zoom .lcd-glow{opacity:0}
#bezel{position:absolute;left:452px;top:172px;width:1016px;height:620px;background:linear-gradient(#17171d,#0b0b0f);border-radius:18px;border:2px solid #2a2a35;box-shadow:0 30px 70px #000a, inset 0 0 0 2px #000}
#bezel:after{content:"";position:absolute;right:26px;bottom:9px;width:8px;height:8px;border-radius:50%;background:#3ddc97;box-shadow:0 0 8px #3ddc97}
#neck{position:absolute;left:918px;top:790px;width:84px;height:62px;background:linear-gradient(90deg,#15151b,#2a2a35,#15151b)}
#foot{position:absolute;left:800px;top:846px;width:320px;height:26px;border-radius:50%;background:linear-gradient(#2a2a35,#0f0f14);box-shadow:0 12px 24px #0008}
#lcdclip{position:absolute;left:480px;top:200px;width:960px;height:540px;overflow:hidden;border-radius:4px;background:#07080d;cursor:zoom-in}
.zoom #lcdclip{cursor:default}
#lcdclip:hover:not(.on){box-shadow:0 0 0 3px #ffb54755}
#lcd{position:absolute;left:0;top:0;width:1600px;height:900px;transform:scale(.6);transform-origin:0 0;pointer-events:none;background:#0b0d14}
.zoom #lcd{pointer-events:auto}
#kb{position:absolute;left:640px;top:900px;width:640px;height:96px;border-radius:12px;background:linear-gradient(#b9b0a0,#8f8778);box-shadow:0 14px 26px #0008;display:none}

/* window */
#win{position:absolute;left:1560px;top:120px;width:300px;height:430px;border:14px solid #2b1f19;background:#0b1020;box-shadow:inset 0 0 0 3px #00000066, 0 0 60px #ffb5471f;overflow:hidden}
#street{position:absolute;inset:0;width:100%;height:100%;background:#101a33}
#blinds{position:absolute;left:0;right:0;top:0;height:100%;transition:height 3s ease;background:repeating-linear-gradient(180deg,#b8aa8c 0 14px,#8c7f66 14px 16px,#0006 16px 17px);box-shadow:0 8px 14px #0008}
#blinds:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:#6e634f}
.open #blinds{height:14%}
.beam{position:absolute;background:linear-gradient(90deg,#ffe3a255,#ffe3a200);transform:skewX(-18deg);pointer-events:none}

/* desk objects */
#phoneobj{position:absolute;left:1560px;top:740px;width:230px;height:120px;cursor:pointer}
#phoneobj .base{position:absolute;left:0;bottom:0;width:230px;height:78px;border-radius:14px;background:linear-gradient(#d9d2c0,#a89f8a);box-shadow:0 10px 18px #0007}
#phoneobj .pad{position:absolute;left:120px;bottom:12px;width:92px;height:52px;background:repeating-linear-gradient(90deg,#3a3a3a 0 14px,#0000 14px 18px),repeating-linear-gradient(0deg,#0000 0 14px,#0000 14px 18px);border-radius:6px;opacity:.9}
#phoneobj .hand{position:absolute;left:8px;top:6px;width:214px;height:38px;border-radius:19px;background:linear-gradient(#26262c,#101014);box-shadow:0 6px 10px #0008}
#phoneobj.ringing{animation:ring .45s infinite}
#phoneobj.ringing .hand{box-shadow:0 0 0 4px #ffb54766,0 6px 10px #0008}
@keyframes ring{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-4px) rotate(-1.4deg)}75%{transform:translateX(4px) rotate(1.4deg)}}
#notebook{position:absolute;left:150px;top:790px;width:250px;height:150px;border-radius:6px;background:linear-gradient(135deg,#3a4a7a,#26335a);transform:rotate(-6deg);box-shadow:0 12px 20px #0008;cursor:pointer}
#notebook:before{content:"";position:absolute;left:14px;top:0;bottom:0;width:6px;background:#0004}
#notebook span{position:absolute;left:0;right:0;top:56px;text-align:center;font:700 14px var(--font);letter-spacing:.2em;color:#cbd3ee99}
#notebook.locked{filter:grayscale(.6) brightness(.7)}
#lampobj{position:absolute;left:70px;top:520px;width:200px;height:260px;pointer-events:none}
#lampobj .arm{position:absolute;left:92px;top:90px;width:10px;height:170px;background:#2a2a30;transform-origin:50% 100%;transform:rotate(-12deg)}
#lampobj .head{position:absolute;left:10px;top:50px;width:150px;height:60px;background:#e2a33b;border-radius:80px 80px 12px 12px;transform:rotate(-12deg)}
#lampobj .base{position:absolute;left:50px;bottom:0;width:110px;height:16px;border-radius:10px;background:#1c1c21}
#clock{position:absolute;left:150px;top:150px;width:110px;height:110px;border-radius:50%;background:#e8dfc9;border:6px solid #1b1310;box-shadow:0 10px 20px #0007}
#clock i{position:absolute;left:50%;top:50%;width:3px;background:#1b1310;transform-origin:50% 100%;border-radius:2px}
#poster{position:absolute;left:1420px;top:130px;width:100px;height:140px;background:linear-gradient(135deg,#d6c2a0,#a68b5b);border:6px solid #1b1310;box-shadow:0 8px 16px #0006}
#poster:after{content:"";position:absolute;left:14px;right:14px;top:16px;bottom:50px;background:#3a2b25;opacity:.7}
.tag{position:absolute;font:600 13px var(--font);color:#ffffffb0;background:#000a;padding:4px 8px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .2s}
.hot:hover + .tag, .hot:hover .tag{opacity:1}

/* ---------- LCD content (1600x900) ---------- */
#lcd .top{height:74px;display:flex;align-items:center;gap:30px;padding:0 32px;border-bottom:1px solid var(--line);background:linear-gradient(#0f121b,#0b0d14)}
.brand{font-weight:800;letter-spacing:.16em;font-size:17px;color:var(--amber)}
.brand small{display:block;font-weight:500;letter-spacing:.03em;color:var(--mute);font-size:13px;margin-top:3px}
.goal{width:560px;margin-left:auto}
.goal-top{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:7px}
.goal-top b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),#ffd27d);border-radius:99px;transition:width .4s}
.bar i.met{background:linear-gradient(90deg,#2fbf84,#7be8b8)}
.spd{display:flex;gap:6px}
.spd button{background:var(--panel2);border:1px solid var(--line);color:var(--mute);padding:7px 13px;border-radius:9px;font:700 13px var(--font);cursor:pointer}
.spd button.on{color:var(--ink);border-color:#3a4260;background:#222842}
#lcd .body{position:absolute;left:0;right:0;top:74px;bottom:0;display:grid;grid-template-columns:340px 560px 1fr;gap:26px;padding:22px 30px 26px}
.rail{display:flex;flex-direction:column;gap:10px;min-height:0}
.tile{position:relative;display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--panel);border:2px solid transparent;cursor:pointer;transition:border-color .2s,background .2s,transform .2s;min-height:0}
.tile:hover{background:var(--panel2)}
.tile.sel{border-color:#3a4260;background:#1a1f31}
.tile.drop{border-color:var(--amber);background:#2a2415}
.tile .mini{position:relative;width:76px;height:156px;border-radius:12px;overflow:hidden;background:#000;flex:none;border:2px solid #2b3149}
.tile .mini canvas{width:100%;height:100%;display:block}
.tile .mini.asleep:after{content:"";position:absolute;inset:0;background:#000a}
.tile .meta{min-width:0;flex:1}
.tile .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.tile .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.tile .st{font-size:13px;color:var(--mute);margin-top:5px;line-height:1.3;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .tm{font-size:13px;color:#6c7490;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .ring{position:absolute;inset:-2px;border-radius:16px;border:3px solid transparent;pointer-events:none;opacity:0}
.tile .ring.go{animation:alert 1.3s ease-out}
.tile .ring.like{--c:#ff3b6b}.tile .ring.com{--c:#5b8cff}.tile .ring.mine{--c:#ffb547}.tile .ring.angry{--c:#ff5a3c}
@keyframes alert{0%{opacity:1;border-color:var(--c);box-shadow:0 0 0 0 var(--c)}100%{opacity:0;border-color:var(--c);box-shadow:0 0 0 18px #0000}}
.tile.empty{opacity:.2;pointer-events:none;min-height:0;padding:0 14px;display:none}
.center{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.center:before{content:"";position:absolute;inset:6% 0;background:radial-gradient(closest-side,#5b8cff1c,#0000)}
#big{position:relative;width:360px;height:740px;transform:scale(1.06);transform-origin:50% 50%}
.right{display:flex;flex-direction:column;gap:18px;min-height:0}
.profile{display:flex;gap:18px;align-items:center;padding:18px 22px;background:var(--panel);border-radius:16px}
.profile .av{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:28px;color:#10131c;flex:none}
.profile .nm{font-size:26px;font-weight:800}
.profile .bio{color:var(--mute);font-size:15px;margin:3px 0 8px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips span{font-size:13px;font-weight:600;background:#222842;border-radius:99px;padding:4px 11px;color:#c7cde4}
.log{flex:1;min-height:0;background:var(--panel);border-radius:16px;padding:16px 22px;overflow:hidden;display:flex;flex-direction:column;gap:9px;justify-content:flex-end}
.log h4{font-size:12px;letter-spacing:.14em;color:#6c7490;font-weight:700;margin-bottom:auto}
.ev{display:flex;gap:10px;align-items:baseline;font-size:15px;color:#c3c9de;animation:cmin .4s}
.ev i{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.ev b{color:#fff}
.ev .t{margin-left:auto;color:#5d6580;font-size:12px;font-variant-numeric:tabular-nums}
.dockbox{background:var(--panel);border-radius:16px;padding:16px 18px;display:flex;gap:16px;height:300px}
.dockbox h4{font-size:12px;letter-spacing:.14em;color:#6c7490;font-weight:700;margin-bottom:10px}
.dockbox .l{flex:1;min-width:0}
.cards{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:118px;gap:12px}
.card{background:var(--paper);color:#1e2333;border-radius:12px;padding:12px 14px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 6px 18px #0006;transition:transform .15s;animation:cmin .5s;overflow:hidden}
.card:hover{transform:translateY(-3px)}
.card .a{font-size:12px;font-weight:800;color:#a8325a;margin-bottom:5px}
.card .x{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card.ghost{position:fixed;z-index:99;pointer-events:none;transform:rotate(-3deg) scale(1.04);box-shadow:0 18px 40px #000a;cursor:grabbing}
.card.gone{opacity:.25}
.trash{width:120px;flex:none;border:2px dashed #3a3347;border-radius:12px;display:grid;place-items:center;color:#7c7390;font-weight:800;letter-spacing:.1em;font-size:13px;transition:.2s;align-self:stretch;margin-top:26px}
.trash.drop{border-color:var(--pink);color:var(--pink);background:#ff3b6b14}
.empty-dock{color:#586080;font-size:14px;grid-column:1/3;padding-top:30px;text-align:center}

/* ---------- phone ---------- */
.phone{position:relative;width:360px;height:740px;background:#000;border-radius:46px;padding:9px;border:3px solid #2b3149;box-shadow:0 24px 60px #0009}
.phone.drop{border-color:var(--amber);box-shadow:0 0 0 6px #ffb54733,0 24px 60px #0009}
.phone.pulse{animation:pulse 1.1s}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffb547aa}100%{box-shadow:0 0 0 30px #ffb54700}}
.screen{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:#000;container-type:size}
.screen.asleep:after{content:"pousou o telemóvel";position:absolute;inset:0;background:#000d;z-index:40;display:grid;place-items:center;font-weight:700;font-size:4cqw;color:#8b93ab}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:26%;height:18px;background:#000;border-radius:99px;z-index:30}
.slide{position:absolute;inset:0;transition:transform .38s cubic-bezier(.3,.7,.2,1)}
.slide canvas{position:absolute;inset:0;width:100%;height:100%}
.slide.in{transform:translateY(100%)}.slide.out{transform:translateY(-100%)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,#0000 18%,#0000 55%,#000b 100%);pointer-events:none}
.tabs{position:absolute;top:34px;left:0;right:0;display:flex;justify-content:center;gap:18px;font-size:3.6cqw;font-weight:700;color:#fff9;text-shadow:0 1px 3px #0008;z-index:5}
.tabs b{color:#fff;border-bottom:2px solid #fff;padding-bottom:3px}
.side{position:absolute;right:3cqw;bottom:20cqh;display:flex;flex-direction:column;align-items:center;gap:3.4cqh;z-index:5}
.side .btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:3cqw;font-weight:700;text-shadow:0 1px 3px #0008}
.side svg{width:9.5cqw;height:9.5cqw;fill:#fff;filter:drop-shadow(0 1px 3px #0008);transition:transform .15s,fill .15s}
.side .liked svg{fill:var(--pink);transform:scale(1.18)}
.avatar{width:10.5cqw;height:10.5cqw;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:800;font-size:4cqw;color:#10131c}
.bottom{position:absolute;left:4cqw;right:19cqw;bottom:4cqh;z-index:5;text-shadow:0 1px 4px #000a}
.bottom .who{font-weight:800;font-size:3.9cqw;margin-bottom:5px}
.bottom .cap{font-size:3.5cqw;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bottom .mus{margin-top:8px;font-size:3cqw;color:#fffc;white-space:nowrap;overflow:hidden}
.bottom .mus span{display:inline-block;animation:tick 9s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
.prog{position:absolute;left:0;bottom:0;height:3px;background:#fff;z-index:6;width:0}
.heart{position:absolute;left:50%;top:44%;width:26cqw;height:26cqw;margin:-13cqw 0 0 -13cqw;fill:var(--pink);opacity:0;z-index:8;pointer-events:none;filter:drop-shadow(0 4px 12px #0008)}
.heart.go{animation:pop .85s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.15)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2) translateY(-20px)}}
.sheet{position:absolute;left:0;right:0;bottom:0;height:66%;background:#14161f;border-radius:18px 18px 0 0;z-index:20;transform:translateY(102%);transition:transform .33s cubic-bezier(.3,.7,.2,1);display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet .hd{text-align:center;font-size:3.3cqw;font-weight:700;padding:3cqh 0 2cqh;border-bottom:1px solid #262b3d;color:#dfe3f1}
.sheet .list{flex:1;overflow:hidden;padding:2cqh 4cqw;display:flex;flex-direction:column;gap:2.2cqh}
.cm{display:flex;gap:2.6cqw;font-size:3.2cqw;line-height:1.3;animation:cmin .35s}
@keyframes cmin{from{opacity:0;transform:translateY(8px)}}
.cm .a{width:7.5cqw;height:7.5cqw;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:3cqw;color:#10131c}
.cm b{display:block;color:#9aa2ba;font-size:2.8cqw;font-weight:700;margin-bottom:1px}
.cm.mine b{color:var(--amber)}
.cm .lk{margin-left:auto;color:#7d86a1;font-size:2.8cqw;flex:none;padding-left:2cqw}
.sheet .in{display:flex;gap:2cqw;align-items:center;padding:2cqh 4cqw 3cqh;border-top:1px solid #262b3d}
.sheet .field{flex:1;background:#232736;border-radius:99px;padding:1.6cqh 3.4cqw;font-size:3.2cqw;color:#e8ebf5;min-height:4.6cqh;white-space:nowrap;overflow:hidden}
.sheet .field:empty::before{content:"Adicionar comentário...";color:#6f7893}
.caret{display:inline-block;width:1.5px;height:1em;background:#fff;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.sendbtn{font-size:3.2cqw;font-weight:800;color:#5b8cff;opacity:.35}.sendbtn.on{opacity:1}
#holder{position:fixed;left:-4000px;top:0;width:400px;height:800px;pointer-events:none}

/* ---------- overlays / hud ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:50}
#back{position:absolute;left:18px;bottom:16px;pointer-events:auto;background:#000a;border:1px solid #ffffff22;color:#fff;padding:8px 14px;border-radius:10px;font:700 13px var(--font);cursor:pointer;display:none}
.zoomed #back{display:block}
#chip{position:absolute;left:50%;bottom:34px;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;background:#ffb547;color:#1a1305;font-weight:800;padding:13px 22px;border-radius:99px;font-size:15px;transition:.3s;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px #000a}
#chip.on{opacity:1;transform:translateX(-50%);pointer-events:auto;cursor:pointer;animation:chipP 1.2s infinite}
@keyframes chipP{0%,100%{box-shadow:0 0 0 0 #ffb54799,0 10px 30px #000a}50%{box-shadow:0 0 0 12px #ffb54700,0 10px 30px #000a}}
#sub{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:min(900px,86vw);background:#0b0d14ee;border:1px solid #ffffff1a;border-radius:16px;padding:18px 24px;display:none;pointer-events:auto;cursor:pointer;box-shadow:0 20px 50px #000a}
#sub .who{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--amber);margin-bottom:8px}
#sub .tx{font-size:21px;line-height:1.4;color:#f3f4fa;min-height:2.8em}
#sub .go{font-size:12px;color:#7d86a1;margin-top:8px;text-align:right}
#card{position:absolute;inset:0;background:#07070a;display:none;place-items:center;pointer-events:auto;opacity:0;transition:opacity .6s}
#card.on{opacity:1}
#card .t{font-size:64px;font-weight:800;letter-spacing:.06em;text-align:center}
#card .t small{display:block;font-size:20px;font-weight:500;letter-spacing:.02em;color:#8b93ab;margin-top:14px}
#summary{position:absolute;inset:0;background:#07070acc;display:none;place-items:center;pointer-events:auto}
#summary .p{background:var(--paper);color:#1e2333;width:min(640px,90vw);border-radius:18px;padding:34px 38px;box-shadow:0 30px 80px #000}
#summary h2{font-size:30px;margin-bottom:6px}
#summary .big{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;margin:8px 0}
#summary p{font-size:17px;line-height:1.5;color:#3b4258}
#summary button{margin-top:22px;background:#1e2333;color:#f1ece0;border:0;border-radius:12px;padding:14px 26px;font:800 16px var(--font);cursor:pointer}
.warns{display:flex;gap:8px;margin-top:14px}
.warns i{width:34px;height:12px;border-radius:99px;background:#d9d1bd}.warns i.on{background:#c0392b}
</style>
</head>
<body>
<div id="vp"><div id="fit"><div id="world">
  <div id="room">
    <div class="stripes"></div><div class="skirt"></div>
    <div id="poster"></div>
    <div id="clock"><i id="ch" style="height:28px"></i><i id="cm" style="height:40px"></i></div>
    <div id="win"><canvas id="street" width="300" height="430"></canvas><div id="blinds"></div></div>
    <div class="beam" style="left:1380px;top:560px;width:120px;height:240px;opacity:.5"></div>
    <div id="desk"></div>

/* ---------- canvas "video" scenes ---------- */
function drawScene(ctx,w,h,t,v){
  const r=v._r||(v._r=seeded(v.id)); if(!v._b){v._b=[];for(let i=0;i<7;i++)v._b.push([r(),r(),.1+r()*.25,r()*6.28,.15+r()*.5]);}
  const g=ctx.createLinearGradient(0,0,w*(.5+.5*Math.sin(t*.4)),h);g.addColorStop(0,v.pal[0]);g.addColorStop(1,v.pal[1]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.globalCompositeOperation='lighter';
  for(const b of v._b){const x=(b[0]+.12*Math.sin(t*b[4]+b[3]))*w,y=(b[1]+.12*Math.cos(t*b[4]*.8+b[3]))*h,rad=b[2]*w;const rg=ctx.createRadialGradient(x,y,0,x,y,rad);rg.addColorStop(0,'rgba(255,255,255,.18)');rg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill();}
  ctx.globalCompositeOperation='source-over';
  const th=v.theme; ctx.save();
  (SCENES[th]||SCENES.default)(ctx,w,h,t,v);
  ctx.restore();
  // big overlay text
  const hot=(th==='politica'||th==='polemica'||v.hot);
  const sh=hot?Math.sin(t*38)*w*.004:0; ctx.textAlign='center';ctx.textBaseline='middle';
  const fs=w*(v.txt.length>16?.075:.095);ctx.font='900 '+fs+'px "Arial Black",Impact,sans-serif';
  const words=v.txt.split(' '),lines=[];let cur='';for(const wd of words){if((cur+' '+wd).trim().length*fs*.62>w*.85&&cur){lines.push(cur);cur=wd}else cur=(cur+' '+wd).trim()}lines.push(cur);
  lines.forEach((ln,i)=>{const y=h*.34+i*fs*1.1+sh;ctx.lineWidth=fs*.16;ctx.strokeStyle='#000b';ctx.strokeText(ln,w/2+sh,y);ctx.fillStyle='#fff';ctx.fillText(ln,w/2+sh,y)});
}

    const hooked=this.hook>0;if(hooked&&!mine)this.hook--;
    let dur=rnd(2.4,3.6)+interest*rnd(6,11);if(hooked)dur*=1.25;const skip=!mine&&!hooked&&interest<.35&&Math.random()<.7;if(skip)dur=rnd(1,1.8);
    const pLike=.08+interest*.62,pCom=.04+hot*.38+match*.2,pWrite=hot*(.35+hid.aggr*.5)+match*.12+(p.key==='Rosa'&&v.theme==='comunidade'?.3:0);
    const doLike=Math.random()<pLike,doOpen=!skip&&Math.random()<pCom,doWrite=doOpen&&Math.random()<pWrite;
    this.say(skip?'passou à frente':'a ver: '+short(v),'watch');if(mine)logEvent(this,'está a ver o teu post','mine'),this.alert('mine');
    const rate=TIMEMULT*(.25+interest*1.15)*(hooked?1.7:1);const t0=performance.now();
    const tm=setInterval(()=>{if(!G.running)return;const g=.1*SPEED*rate;this.mins+=g;TOTAL+=g;this.tm.textContent=fmt(this.mins);updateTotal()},100);
    const tp=setInterval(()=>{const f=Math.min(1,(performance.now()-t0)/1000*SPEED/dur);if(this.slide&&this.slide.prog)this.slide.prog.style.width=(f*100)+'%'},60);
    const sched=(f,at)=>setTimeout(f,at*dur*1000/SPEED);
    if(doLike)sched(()=>{this.like();this.alert('like');if(!skip)logEvent(this,'gostou de «'+short(v)+'»','like')},skip?.5:rnd(.25,.55));
    let comP=Promise.resolve();
    if(doOpen){comP=new Promise(res=>sched(async()=>{
      this.sheet.classList.add('open');this.say('a ler comentários','com');await wait(rnd(1800,2800));
      if(doWrite){this.say('a escrever...','com');const t=this.pickComment(v,angry);await this.typeComment(t);this.say('comentou: "'+t+'"','com');this.alert(angry&&v.hot?'angry':'com');logEvent(this,'comentou: "'+t+'"','com');await wait(900)}
      this.sheet.classList.remove('open');res()},rnd(.5,.65)))}
    await wait(dur*1000);await comP;clearInterval(tm);clearInterval(tp);
    this.effects(v);
    this.energy=Math.max(0,Math.min(1,this.energy-(1-interest)*.25-.05+hot*.08));
  }
  pickComment(v,angry){
    const k=this.p.key;
    if(k==='Rosa')return v.hot?pick(['que triste isto','calma, pessoal','podiam falar com educação']):pick(['que bom!','guardei a receita','obrigada por partilhar','adorei, beijinhos']);
    if(k==='Tiago')return v.theme==='meme'?pick(['kkkkk','partilhado','isto sou eu','não consigo parar']):pick(['grande jogo','epá isto é bom','mais um']);
    if(k==='Leonor')return v.hot?pick(['isto preocupa-me','podemos conversar sem gritar?','calma, pessoal']):pick(['li este livro','recomendo muito','que bonito','adoro isto']);
    if(k==='Hugo')return v.hot?pick(['vergonha de marca','nunca mais compro lá','é sempre o mesmo']):pick(['onde compro?','link?','grande desconto','já comprei']);
    return v.hot?(angry?pick(COMMENTS.fight):pick(COMMENTS.hot)):pick(['já viram isto?','interessante','vamos ver no que dá']);
  }
  effects(v){
    const h=this.hid,k=this.p.open;
    if(v.hot){h.aggr=Math.min(1,h.aggr+.07*(1.2-k*.5));h.bubble=Math.min(1,h.bubble+.05)}else h.aggr=Math.max(this.p.aggr*.7,h.aggr-.02);
    if(v.theme==='meme'||v.theme==='desporto')h.iso=Math.min(1,h.iso+.04);
    if(v.role==='ponte'){h.bubble=Math.max(0,h.bubble-.12);h.iso=Math.max(0,h.iso-.08)}
    for(const n of v.mentions||[]){const o=G.agents.find(a=>a.p.key===n);if(o&&o!==this)o.hid.aggr=Math.min(1,o.hid.aggr+.05)}
  }
}

/* ---------- boot agents, focus, profile, log ---------- */
let TOTAL_REF=0;
G.agents=PEOPLE.map((p,i)=>new Agent(p,i));
function focusOn(a){
  if(G.focus===a||!a.active)return;
  if(G.focus){holder.appendChild(G.focus.phone);G.focus.setRes(.5);G.focus.tile.classList.remove('sel')}
  G.focus=a;big.appendChild(a.phone);a.setRes(1);a.tile.classList.add('sel');renderProfile(a);
}
function renderProfile(a){
  $('#profile').innerHTML=`<div class="av" style="background:${a.p.col}">${a.p.short}</div><div><div class="nm">${a.p.name}</div><div class="bio">${a.p.bio}</div><div class="chips">${a.p.likes.map(l=>`<span>${LABEL[l]}</span>`).join('')}</div></div>`;
}
function dayClock(){return 9+(G.dayT/G.DAYLEN)*8}
function logEvent(a,text,kind){
  const h=Math.floor(dayClock()),m=Math.floor((dayClock()%1)*60);
  const d=el('div','ev',`<i style="background:${a.p.col}"></i><span><b>${a.p.key}</b> ${esc(text)}</span><span class="t">${h}:${String(m).padStart(2,'0')}</span>`);
  const box=$('#evs');box.appendChild(d);while(box.children.length>7)box.firstChild.remove();
}
function updateTotal(){$('#tot').textContent=fmt(TOTAL);const bar=$('#goalbar');bar.style.width=Math.min(100,TOTAL/G.goal*100)+'%';bar.classList.toggle('met',TOTAL>=G.goal)}

/* ---------- dock + drag ---------- */
function planDay(){
  const d=G.day;const fresh=POSTS.filter(p=>p.minDay===d&&!G.used.has(p.id)),older=POSTS.filter(p=>p.minDay<d&&!G.used.has(p.id));
  const sh=a=>a.sort(()=>Math.random()-.5);sh(fresh);sh(older);
  const q=[];fresh.slice(0,3).forEach(p=>q.push(p));older.forEach(p=>{if(q.length<5)q.push(p)});fresh.slice(3).forEach(p=>{if(q.length<5)q.push(p)});
  G.plan=sh(q).map((p,i)=>({at:[3,20,38,56,72][i],p}));G.dock=[];renderDock();
}
function renderDock(){
  const box=$('#cards');box.innerHTML='';
  if(!G.dock.length){box.innerHTML='<div class="empty-dock">à espera do próximo post...</div>';return}
  G.dock.slice(0,4).forEach(p=>{const c=el('div','card',`<div class="a">${esc(p.creator)}</div><div class="x">${esc(p.cap)}</div>`);c._p=p;c.addEventListener('pointerdown',e=>startDrag(e,c));box.appendChild(c)});
}
function startDrag(e,c){
  e.preventDefault();const r=c.getBoundingClientRect(),g=c.cloneNode(true);const k=r.width/c.offsetWidth;
  g.classList.add('ghost');g.style.width=c.offsetWidth+'px';g.style.height=c.offsetHeight+'px';g.style.transformOrigin='0 0';g.style.transform='scale('+k+') rotate(-2deg)';document.body.appendChild(g);c.classList.add('gone');
  const ox=e.clientX-r.left,oy=e.clientY-r.top;let target=null;
  const mv=ev=>{g.style.left=ev.clientX-ox+'px';g.style.top=ev.clientY-oy+'px';
    const els=document.elementsFromPoint(ev.clientX,ev.clientY);
    const tile=els.find(x=>x.classList&&x.classList.contains('tile'));const ph=els.find(x=>x.classList&&x.classList.contains('phone'));const tr=els.find(x=>x.id==='trash');
    document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
    let a=null;if(tile)a=G.agents.find(x=>x.tile===tile);else if(ph)a=G.agents.find(x=>x.phone===ph);
    target=a?{agent:a}:tr?{trash:true}:null;if(tile)tile.classList.add('drop');else if(ph)ph.classList.add('drop');if(tr)tr.classList.add('drop');};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);g.remove();document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
    if(!target||!G.running){c.classList.remove('gone');return}
    const p=c._p;G.dock=G.dock.filter(x=>x!==p);G.used.add(p.id);
    if(target.agent){target.agent.queue.push(p);target.agent.say('o teu post vem a seguir','mine');logEvent(target.agent,'vai receber o teu post','mine');target.agent.alert('mine')}
    else{TOTAL=Math.max(0,TOTAL-20);updateTotal()}
    renderDock()};
  mv(e);addEventListener('pointermove',mv);addEventListener('pointerup',up);
}

/* ---------- room, zoom, fit ---------- */
const fitEl=$('#fit');
function fit(){const f=Math.min(innerWidth/1920,innerHeight/1080);fitEl.style.transform='scale('+f+')';fitEl.style.left=(innerWidth-1920*f)/2+'px';fitEl.style.top=(innerHeight-1080*f)/2+'px'}
addEventListener('resize',fit);fit();
function zoom(on){G.mode=on?'lcd':'room';fitEl.classList.toggle('zoom',on);document.body.classList.toggle('zoomed',on)}
$('#lcdclip').addEventListener('click',()=>{if(G.mode==='room')zoom(true)});
$('#back').onclick=()=>zoom(false);
addEventListener('keydown',e=>{if(e.key==='Escape')zoom(false);const n=parseInt(e.key);if(n>=1&&n<=5&&G.agents[n-1])focusOn(G.agents[n-1])});
document.querySelectorAll('.spd [data-sp]').forEach(b=>b.onclick=()=>{SPEED=+b.dataset.sp;document.querySelectorAll('.spd [data-sp]').forEach(x=>x.classList.toggle('on',x===b))});
function drawStreet(t){
  const c=$('#street').getContext('2d'),w=300,h=430;const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1a2550');g.addColorStop(1,'#42386b');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.fillStyle='#0e1428';for(let i=0;i<6;i++){const bw=60,bh=140+((i*53)%80);c.fillRect(i*52-6,h-bh-60,bw,bh+60)}
  c.fillStyle='#ffd166';for(let i=0;i<6;i++)for(let k=0;k<5;k++)for(let j=0;j<2;j++)if(Math.sin(i*7+k*3+j+Math.floor(t/4))>.1)c.fillRect(i*52+8+j*24,h-190-((i*53)%80)+k*26,10,12);
  c.fillStyle='#161a2e';c.fillRect(0,h-60,w,60);
}
// wall clock
function setClock(){const hh=dayClock(),m=(hh%1)*60;$('#ch').style.transform='translateX(-50%) rotate('+((hh%12)*30+m/2)+'deg)';$('#cm').style.transform='translateX(-50%) rotate('+(m*6)+'deg)'}
$('#ch').style.marginLeft='-1.5px';$('#cm').style.marginLeft='-1.5px';$('#ch').style.top='calc(50% - 28px)';$('#cm').style.top='calc(50% - 40px)';

/* ---------- dialogue, calls ---------- */
const chip=$('#chip'),sub=$('#sub');
function ring(){return new Promise(res=>{
  chip.classList.add('on');$('#phoneobj').classList.add('ringing');
  const done=()=>{chip.classList.remove('on');$('#phoneobj').classList.remove('ringing');chip.onclick=null;$('#phoneobj').onclick=null;res()};
  chip.onclick=done;$('#phoneobj').onclick=done})}
function say(lines){return new Promise(res=>{
  let i=0;sub.style.display='block';
  const show=()=>{if(i>=lines.length){sub.style.display='none';sub.onclick=null;res();return}$('.who',sub).textContent=lines[i][0].toUpperCase();$('.tx',sub).textContent=lines[i][1];i++};
  sub.onclick=show;show()})}
const SCRIPT={
 1:{pre:[['Sara','Olá! Sou a Sara, trabalho aqui ao lado. Primeiro dia, não é?'],['Sara','É fácil: chega-te um post, arrastas para o telemóvel de quem quiseres. Clica num vizinho à esquerda para o veres de perto.'],['Sara','Vai tocar o telefone. É o Dr. Valente. Atende sempre.']],call:[['Dr. Valente','Bom dia! Dr. Valente. Hoje o objetivo são 7 minutos de tempo na app. Simples, não é?']]},
 2:{pre:[],call:[['Dr. Valente','Ontem correu bem. Hoje subimos a fasquia: 11 minutos. E temos uma nova utilizadora, a Leonor.'],['Sara','Ouvi dizer que as polémicas rendem. Não fui eu que disse.']]},
 3:{pre:[],call:[['Dr. Valente','Meta de hoje: 15 minutos. Ah, mandei abrir os estores, isto estava muito escuro.'],['Sara','Agora podes ver a rua. Eu não olharia demasiado.']]},
 4:{pre:[],call:[['Dr. Valente','Dezanove minutos. O Hugo entra hoje. Preciso de mais, e sem desculpas.']]},
 5:{pre:[],call:[['Dr. Valente','Último dia. Vinte e quatro minutos. Sei que consegue.']]}
};
function dayCard(t,s){return new Promise(async res=>{const c=$('#card');c.style.display='grid';$('.t',c).innerHTML=t+'<small>'+s+'</small>';await rwait(30);c.classList.add('on');await rwait(2000);c.classList.remove('on');await rwait(600);c.style.display='none';res()})}

/* ---------- day loop ---------- */
async function playDay(){
  const d=G.day;G.goal=GOALS[d-1]*60;TOTAL=0;G.dayT=0;
  G.agents.forEach(a=>{a.mins=0;a.tm.textContent='0:00';a.energy=1;a.queue.length=0});
  $('#dayl').textContent='Dia '+d;$('#goalv').textContent=GOALS[d-1]+':00';updateTotal();
  if(d>=3&&!G.blinds){G.blinds=true;$('#win').classList.add('open')}
  G.agents.filter(a=>a.p.start<=d).forEach(a=>a.activate());
  if(!G.focus)focusOn(G.agents[0]);
  $('#evs').innerHTML='';
  await dayCard('Dia '+d,['Primeiro dia de trabalho','Mais uma manhã','Um dia diferente','Segunda metade da semana','Último dia'][d-1]);
  if(SCRIPT[d].pre.length)await say(SCRIPT[d].pre);
  await ring();await say(SCRIPT[d].call);
  planDay();G.running=true;
  while(G.dayT<G.DAYLEN)await rwait(250);
  G.running=false;G.dock=[];renderDock();
  await rwait(2500);
  await endOfDay();
}
async function endOfDay(){
  const met=TOTAL>=G.goal;if(!met)G.warnings++;
  const fired=G.warnings>=3;
  await ring();
  await say(met?[['Dr. Valente','Meta cumprida. Excelente trabalho.']]:[['Dr. Valente','Não chegámos à meta. Isto fica registado.']]);
  await new Promise(res=>{
    const s=$('#summary');s.style.display='grid';
    $('.p',s).innerHTML=`<h2>${met?'Meta cumprida':'Meta falhada'}</h2><div class="big">${fmt(TOTAL)} <span style="font-size:22px;color:#6b7391">/ ${GOALS[G.day-1]}:00</span></div><p>${met?'O Dr. Valente ficou satisfeito.':'Aviso '+G.warnings+' de 3.'}</p><div class="warns"><i class="${G.warnings>0?'on':''}"></i><i class="${G.warnings>1?'on':''}"></i><i class="${G.warnings>2?'on':''}"></i></div><button>${fired||G.day>=5?'Ver o fim':'Dia '+(G.day+1)}</button>`;
    $('button',s).onclick=()=>{s.style.display='none';res()}});
  if(fired||G.day>=5)return ending(fired);
  G.day++;playDay();
}
function ending(fired){
  G.ended=true;zoom(false);
  const A=G.agents.filter(a=>a.active),avg=k=>A.reduce((s,a)=>s+a.hid[k],0)/A.length;
  let t,txt;
  if(fired){t='Despedido';txt='Falhaste as metas. O Dr. Valente chamou-te ao gabinete. O bairro continua lá fora, sem ti a decidir o que veem.'}
  else if(avg('aggr')>.55){t='Bairro dividido';txt='Cumpriste as metas. Já ninguém se fala na rua.'}
  else if(avg('iso')>.35){t='Bairro adormecido';txt='Cumpriste as metas. Ninguém sai de casa.'}
  else {t='Cego';txt='Cumpriste as metas sem nunca perceber o que fizeste.'}
  const s=$('#summary');s.style.display='grid';$('.p',s).innerHTML=`<h2>${t}</h2><p style="margin-top:10px">${txt}</p><button onclick="location.reload()">Recomeçar</button>`;
}

/* ---------- main loop ---------- */
let last=performance.now();
(function loop(){
  requestAnimationFrame(loop);const n=performance.now(),dt=Math.min(.1,(n-last)/1000);last=n;
  if(G.running){G.dayT+=dt*SPEED;while(G.plan.length&&G.plan[0].at<=G.dayT){G.dock.push(G.plan.shift().p);renderDock()}}
  G.agents.forEach(a=>{if(a.active)a.draw()});setClock();drawStreet(n/1000);
})();
playDay();
</script>
